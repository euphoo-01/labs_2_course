services:
    postgres:
        image: postgres:15
        container_name: course_selling_app_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres # Start with default db to allow script to create custom db
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: always
        networks:
            - course-app-network

volumes:
    pgdata:

networks:
    course-app-network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.25.0.0/24
